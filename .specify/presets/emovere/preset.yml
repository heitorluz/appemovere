schema_version: "1.0"

preset:
  id: "emovere"
  name: "Emovere"
  version: "1.1.1"
  description: "Applies the Emovere constitution: one artifact per phase and who decides what (ADR-032)."
  author: "Heitor Luz"
  repository: "https://github.com/heitorluz/appemovere"
  license: "UNLICENSED"

requires:
  speckit_version: ">=1.1.3"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Adds Safety Criteria and References, Clarifications and Decided without asking"
      strategy: "append"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Decisions, Model, Contract, Manual validation and the Constitution Check (I to VIII)"
      replaces: "plan-template"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Test-first tasks citing IDs, plus Analysis, Convergence and Review"
      replaces: "tasks-template"

    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Quality check without a file; owner questions by category"
      strategy: "wrap"

    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "One round of categorized questions; quality check without a file"
      strategy: "wrap"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Only plan.md: no research, data-model, contracts or quickstart files"
      strategy: "wrap"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Reads spec.md and plan.md only; verbatim constraints from the Model section"
      strategy: "wrap"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Records findings and fixes in the Analysis section of tasks.md"
      strategy: "wrap"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "No checklists; TDD with RED → GREEN → REFACTOR evidence; never commits"
      strategy: "wrap"

    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Records each round in the Convergence section of tasks.md"
      strategy: "wrap"

    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Categorized owner questions; history entry per amendment"
      strategy: "wrap"

    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Disabled: the spec quality check runs inside specify and clarify"
      replaces: "speckit.checklist"

tags:
  - "emovere"
  - "lean"
  - "governance"
